[workspace]
members = ["app", "cli"]

[package]
name = "maroontree"
version = "0.1.12"
edition = "2024"
description = "AV1 image & AV2 video and image encoder"
readme = "README.md"
keywords = ["avif", "av1", "av2", "encoder", "image"]
license = "BSD-3-Clause OR Apache-2.0"
authors = ["Radzivon Bartoshyk"]
documentation = "https://docs.rs/maroontree"
categories = ["multimedia::images", "compression", "encoding", "multimedia::video"]
homepage = "https://github.com/awxkee/maroontree"
repository = "https://github.com/awxkee/maroontree"
exclude = ["*.jpg", "/assets", "*.png", "*.sh", "/assets/*", "/scripts/*"]
rust-version = "1.94.0"

[dependencies]
hashbrown = "0.17"

[features]
default = ["neon", "avx"]
neon = []
avx = []
# Offline parameter study only (see src/tuning.rs + parameters_fit/)
tuning = []

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = "full"
