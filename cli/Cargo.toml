[package]
name = "maroontree-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["string"] }
image = "0.25.10"
maroontree = { path = "../" }
img-parts = "0.4.1"
yuv = "0.8.19"
anyhow = "1.0.104"
moxcms = { version = "0.9.1" }
hpvcd = { version = "0.3.4", optional = true }
fast_transpose = "0.2.7"
thiserror = "2.0.20"
hpvca = { version = "0.2.3", optional = true }
jixel = "0.5.2"
jhm17 = { git = "https://github.com/awxkee/jhm17", features = ["polish"] }
jxl = "0.8.0"
bytemuck = "1.25.2"
garnetash = { version = "0.1.1", optional = true }
tealdust = { path = "../../tealdust" } # was "0.1.5": crates.io build predates the AVM-conformance fixes
gainforge = { version = "0.5.1", default-features = false, features = ["uhdr"], optional = true }
quick-xml = { version = "0.42.0", optional = true }
kamadak-exif = { version = "0.6.1", optional = true }

[build-dependencies]
toml = "1.1.8+spec-1.1.0"

[features]
default = ["heic", "vvc"]
heic = ["dep:hpvcd", "dep:hpvca", "dep:gainforge", "dep:quick-xml", "dep:kamadak-exif"]
vvc = ["garnetash"]
