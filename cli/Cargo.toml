[package]
name = "maroontree-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.10"
maroontree = { path = "../" }
img-parts = "0.4.0"
yuv = "0.8.17"
anyhow = "1.0.104"
moxcms = { version = "0.9.0" }
hpvcd = { version = "0.3.2", optional = true }
fast_transpose = { version = "0.2.7", optional = true }
thiserror = "2.0.20"
hpvca = { version = "0.1.17", optional = true }
jixel = "0.2.21"
jxl = "0.6.0"
bytemuck = "1.25.2"
garnetash = { version = "0.1.1", optional = true }
tealdust = "0.1.5"

[features]
default = ["heic", "vvc"]
heic = ["dep:hpvcd", "dep:fast_transpose", "dep:hpvca"]
vvc = ["garnetash"]
