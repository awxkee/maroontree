[package]
name = "maroontree-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.10"
maroontree = { path = "../" }
img-parts = "0.4.0"
yuv = "0.8.15"
anyhow = "1.0.102"
moxcms = { version = "0.8.1" }
hpvcd = { version = "0.2.1", optional = true }
fast_transpose = { version = "0.2.7", optional = true }
thiserror = "2.0.18"
hpvca = { version = "0.1.9", optional = true }
jixel = "0.2.4"
jxl = "0.4.3"
bytemuck = "1.25.0"
garnetash = "0.1.0"
tealdust = "0.1.2"

[features]
default = ["heic", "vvc"]
heic = ["dep:hpvcd", "dep:fast_transpose", "dep:hpvca"]
vvc = []